name: Build demo assets

# Builds the T3Code demo bundle (scripts/sync-demo.sh) and the per-theme
# screenshots (npm run shots), then publishes both as a tarball on the rolling
# "demo-assets" release. Deploys fetch it with scripts/fetch-demo-assets.sh
# instead of rebuilding the t3code monorepo every time.

on:
  workflow_dispatch:
  schedule:
    - cron: "47 7 * * 1"
  push:
    branches: [main]
    paths:
      - "themes/**"
      - "src/vendor/**"
      - "scripts/sync-demo.sh"
      - "scripts/capture-theme-shots.ts"
      - "scripts/generate-theme-dates.mjs"
      - ".github/workflows/build-demo-assets.yml"

concurrency:
  group: demo-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: theme-dates.json needs each file's first commit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pnpm (t3code's package manager)
        run: npm install -g pnpm@11.10.0
      - run: npm ci
      - name: Build T3Code demo bundle
        run: bash scripts/sync-demo.sh
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture theme screenshots
        run: npm run shots
      - name: Generate theme added-dates manifest
        run: node scripts/generate-theme-dates.mjs
      - name: Package assets
        run: tar -czf demo-assets.tar.gz public/sidebar-demo public/shots public/theme-dates.json
      - name: Publish to the demo-assets release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create demo-assets --title "Demo assets" --notes \
            "Auto-built T3Code demo bundle + theme screenshots + added-dates manifest. Deploys download this via scripts/fetch-demo-assets.sh. Rebuilt weekly and when themes or vendored files change." \
            2>/dev/null || true
          gh release upload demo-assets demo-assets.tar.gz --clobber
      - name: Trigger site redeploy
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null && echo "redeploy triggered"
          else
            echo "CLOUDFLARE_DEPLOY_HOOK secret not set — skipping"
          fi
